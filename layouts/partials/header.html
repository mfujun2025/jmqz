<header class="site-header">
  <div class="header-top">
    <div class="container">
      <div class="header-top-inner">
        <span class="header-notice">医疗器械经营备案凭证：{{ .Site.Params.medicalLicense }}</span>
        <span class="header-contact">客服热线：{{ .Site.Params.contactPhone }} | 微信：{{ .Site.Params.contactWechat }}</span>
      </div>
    </div>
  </div>
  <div class="header-main">
    <div class="container">
      <div class="header-main-inner">
        <a href="{{ "/" | relURL }}" class="site-logo">
          <span class="logo-icon">舒</span>
          <div class="logo-text">
            <span class="logo-name">{{ .Site.Params.siteName }}</span>
            <span class="logo-slogan">{{ .Site.Params.siteSubtitle }}</span>
          </div>
        </a>
        <nav class="site-nav" id="siteNav">
          {{ range .Site.Menus.main }}
          <a href="{{ .URL | relURL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">{{ .Name }}</a>
          {{ end }}
        </nav>
        <button class="btn btn-primary btn-shop" data-wechat>微信咨询</button>
        <button class="nav-toggle" id="navToggle" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </div>
</header>
